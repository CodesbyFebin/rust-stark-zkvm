name: Dashboard quality gate

on:
  pull_request:
    paths:
      - "homepage-next/**"
      - "site/command-center/**"
      - "site/assets/dragon-command.webp"
      - ".github/workflows/dashboard-ci.yml"
  push:
    branches: [main]
    paths:
      - "homepage-next/**"
      - "site/command-center/**"
      - "site/assets/dragon-command.webp"
      - ".github/workflows/dashboard-ci.yml"

jobs:
  dashboard:
    name: Static command center and Next.js site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homepage-next/package-lock.json

      - name: Check standalone dashboard JavaScript
        run: node --check site/command-center/app.js

      - name: Verify dragon artwork is present
        run: test -s site/assets/dragon-command.webp

      - name: Install website dependencies
        run: npm ci
        working-directory: homepage-next

      - name: Lint website
        run: npm run lint
        working-directory: homepage-next

      - name: Build static website
        run: npm run build
        working-directory: homepage-next

      - name: Check static-site sync script syntax
        run: bash -n sync-next-to-site.sh

      - name: Sync export into deploy root
        run: ./sync-next-to-site.sh

      - name: Ensure hand-authored command center survives sync
        run: |
          test -s site/command-center/index.html
          test -s site/command-center/app.js
          test -s site/assets/dragon-command.webp
